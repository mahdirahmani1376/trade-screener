x-laravel: &laravel
  image: ghcr.io/mahdirahmani1376/trade-screnner-php:latest
  networks:
    - app-network
  extra_hosts:
    - "host.docker.internal:host-gateway"
  restart: unless-stopped
  volumes:
    - ./secrets/google_key.json:/var/www/html/storage/app/private/google_key.json:ro
    - ./secrets/private.key:/var/www/html/storage/app/private/private.key:ro
    - laravel-storage:/var/www/html/storage
  env_file:
    - /opt/trade-screnner/.env
  environment:
    TZ: Asia/Tehran
  depends_on:
    mysql:
      condition: service_healthy
    redis:
      condition: service_healthy

services:
  php:
    <<: *laravel
    container_name: trade-screnner-php
    command: php-fpm
    environment:
      APP_SERVICE: php

  horizon:
    <<: *laravel
    container_name: trade-screnner-horizon
    command: php artisan horizon
    environment:
      APP_SERVICE: horizon

  reverb:
    <<: *laravel
    command: php artisan reverb:start
    container_name: trade-screnner-reverb
    environment:
      APP_SERVICE: reverb

  scheduler:
    <<: *laravel
    container_name: trade-screnner-scheduler
    command: php artisan schedule:work
    environment:
      APP_SERVICE: scheduler

  nginx:
    image: ghcr.io/mahdirahmani1376/trade-screnner-nginx:latest
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - /root/.acme.sh/trade-screnner-crawler.ir_ecc:/etc/nginx/certs:ro
      - /opt/trade-screnner/infra/nginx/production/default.conf:/etc/nginx/conf.d/default.conf
    depends_on:
      - php
    networks:
      - app-network
    environment:
      TZ: Asia/Tehran

    container_name: trade-screnner-nginx
    restart: unless-stopped

  mysql:
    image: mysql:8.0
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "mysqladmin ping -h localhost -uroot -p$$MYSQL_ROOT_PASSWORD --silent"
        ]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 30s
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      TZ: Asia/Tehran
    ports:
      - "3308:3306"
    networks:
      - app-network
    container_name: trade-screnner-mysql
    restart: unless-stopped
    volumes:
      - /opt/trade-screnner/infra/mysql-conf/my.cnf:/etc/mysql/my.cnf
      - mysql-data:/var/lib/mysql

  redis:
    image: redis:latest
    volumes:
      - redis-data:/data
    environment:
      TZ: Asia/Tehran
    networks:
      - app-network
    container_name: trade-screnner-redis
    restart: unless-stopped
    command: >
      redis-server
      --requirepass "${REDIS_PASSWORD}"
      --maxmemory 200mb
      --maxmemory-policy allkeys-lru
      --appendonly yes
      --appendfsync everysec
    healthcheck:
      test: [ "CMD", "redis-cli", "-a", "${REDIS_PASSWORD}", "ping" ]
      interval: 10s
      timeout: 5s
      retries: 5

  phpmyadmin:
    image: phpmyadmin/phpmyadmin
    container_name: trade-screnner-phpmyadmin
    restart: unless-stopped
    depends_on:
      - mysql
    environment:
      PMA_HOST: mysql
      PMA_PORT: 3306
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      UPLOAD_LIMIT: 512M
      TZ: Asia/Tehran
    networks:
      - app-network

  loki:
    image: grafana/loki
    restart: unless-stopped
    container_name: trade-screnner-loki
    command: -config.file=/etc/loki/config.yml
    volumes:
      - /opt/trade-screnner/infra/loki-config.yml:/etc/loki/config.yml
      - loki-data:/loki
    networks:
      - app-network

  promtail:
    image: grafana/promtail:latest
    restart: unless-stopped
    container_name: trade-screnner-promtail
    volumes:
      - /var/lib/docker/containers:/var/lib/docker/containers:ro
      - /var/run/docker.sock:/var/run/docker.sock
      - /opt/trade-screnner/infra/promtail-config.yml:/etc/promtail/config.yml
      - promtail-data:/tmp
      - laravel-storage:/var/www/html/storage:ro
    command: -config.file=/etc/promtail/config.yml
    depends_on:
      - loki
    networks:
      - app-network

  grafana:
    image: grafana/grafana
    restart: unless-stopped
    container_name: trade-screnner-grafana
    volumes:
      - grafana-data:/var/lib/grafana
    environment:
      - GF_SERVER_ROOT_URL=https://grafana.trade-screnner-crawler.ir
      - GF_SERVER_DOMAIN=grafana.trade-screnner-crawler.ir
      - GF_SECURITY_ADMIN_USER=${GF_SECURITY_ADMIN_USER:-890rty@(%}
      - GF_SECURITY_ADMIN_PASSWORD=${GF_SECURITY_ADMIN_PASSWORD:-890rty@(%}
    depends_on:
      - loki
    networks:
      - app-network

  prometheus:
    image: prom/prometheus:latest
    container_name: trade-screnner-prometheus
    restart: unless-stopped
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --storage.tsdb.retention.time=15d
    volumes:
      - prometheus-data:/prometheus
      - /opt/trade-screnner/infra/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - /opt/trade-screnner/infra/prometheus/alerts.yml:/etc/prometheus/alerts.yml:ro
    depends_on:
      - node-exporter
      - alertmanager
    networks:
      - app-network

  node-exporter:
    image: prom/node-exporter:latest
    container_name: trade-screnner-node-exporter
    restart: unless-stopped
    command:
      - --path.rootfs=/host
    volumes:
      - /:/host:ro,rslave
    networks:
      - app-network

  alertmanager:
    image: prom/alertmanager:latest
    container_name: trade-screnner-alertmanager
    restart: unless-stopped
    command:
      - --config.file=/etc/alertmanager/alertmanager.yml
      - --storage.path=/alertmanager
    volumes:
      - alertmanager-data:/alertmanager
      - /opt/trade-screnner/infra/alertmanager/alertmanager.yml:/etc/alertmanager/alertmanager.yml:ro
      - ./secrets/telegram_bot_token:/etc/alertmanager/telegram_bot_token:ro
    networks:
      - app-network

  redisinsight:
    image: redis/redisinsight:latest
    container_name: trade-screnner-redisinsight
    restart: unless-stopped
    volumes:
      - redisinsight_data:/data
    depends_on:
      - redis
    networks:
      - app-network
    environment:
      RI_ENCRYPTION_KEY: ${REDISINSIGHT_ENCRYPTION_KEY}

volumes:
  redisinsight_data:
    name: trade-screnner-redis-insight
  laravel-storage:
    name: trade-screnner-laravel-storage
  promtail-data:
    name: trade-screnner-promtail-data
  loki-data:
    name: trade-screnner-loki-data
  grafana-data:
    name: trade-screnner-grafana-data
  mysql-data:
    name: trade-screnner-mysql-data
  redis-data:
    name: trade-screnner-redis-data
  prometheus-data:
    name: trade-screnner-prometheus-data
  alertmanager-data:
    name: trade-screnner-alertmanager-data

networks:
  app-network:
    driver: bridge
